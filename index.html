<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Explorador de la base relacional construida a partir de los subtítulos de 121 episodios de Mea Culpa.">
<title>Explorador Mea Culpa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: expediente de dos columnas. Filtros a la izquierda, casos o ficha del episodio a la derecha. */
:root{
  --bg:#F1F2EF; --panel:#FFFFFF; --sunk:#E7E9E5; --ink:#1A1F26; --muted:#5B636D; --line:#D6D9D4; --accent:#8C2A22; --accent-soft:#F3E3E0;
  --ph-antecedentes:#6F7F95; --ph-escalada:#B8892B; --ph-detonante:#D2652B; --ph-crimen:#9E2B25; --ph-proceso_legal:#3B6A8F; --ph-consecuencias:#5F8269;
  --r-victimario:#1A1F26; --r-victima:#B5372D; --r-complice:#6B5B7A; --r-autoridad:#3B6A8F; --r-tercero_afectado:#C9A466; --r-sin_rol_criminal:#B4BAB3; --r-testigo:#B4BAB3;
  --v-afecto:#2F8075; --v-hostil:#B5372D; --v-ambivalente:#B8892B; --v-neutro:#9AA19A;
 --s1:#E6E3F1; --s2:#C2BBE0; --s3:#9387C6; --s4:#6253A6; --s5:#372A78; --s1t:#1A1F26; --s2t:#1A1F26; --s3t:#FFFFFF; --s4t:#FFFFFF; --s5t:#FFFFFF;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13161A; --panel:#1B1F25; --sunk:#22272E; --ink:#E5E7E9; --muted:#99A1AB; --line:#2F353D; --accent:#E57366; --accent-soft:#3A2321;
  --ph-antecedentes:#8C9BB1; --ph-escalada:#D4A645; --ph-detonante:#E98049; --ph-crimen:#E0574D; --ph-proceso_legal:#6497C0; --ph-consecuencias:#82A88B;
  --r-victimario:#E5E7E9; --r-victima:#E0574D; --r-complice:#A08FB0; --r-autoridad:#6497C0; --r-tercero_afectado:#D4B57A; --r-sin_rol_criminal:#5C636B; --r-testigo:#5C636B;
  --v-afecto:#4DB3A5; --v-hostil:#E0574D; --v-ambivalente:#D4A645; --v-neutro:#6B727A;
 --s1:#3A3552; --s2:#574D84; --s3:#7C6FB4; --s4:#A799DB; --s5:#D5CCF7; --s1t:#E5E7E9; --s2t:#E5E7E9; --s3t:#FFFFFF; --s4t:#13161A; --s5t:#13161A;
 color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13161A; --panel:#1B1F25; --sunk:#22272E; --ink:#E5E7E9; --muted:#99A1AB; --line:#2F353D; --accent:#E57366; --accent-soft:#3A2321;
  --ph-antecedentes:#8C9BB1; --ph-escalada:#D4A645; --ph-detonante:#E98049; --ph-crimen:#E0574D; --ph-proceso_legal:#6497C0; --ph-consecuencias:#82A88B;
  --r-victimario:#E5E7E9; --r-victima:#E0574D; --r-complice:#A08FB0; --r-autoridad:#6497C0; --r-tercero_afectado:#D4B57A; --r-sin_rol_criminal:#5C636B; --r-testigo:#5C636B;
  --v-afecto:#4DB3A5; --v-hostil:#E0574D; --v-ambivalente:#D4A645; --v-neutro:#6B727A;
 --s1:#3A3552; --s2:#574D84; --s3:#7C6FB4; --s4:#A799DB; --s5:#D5CCF7; --s1t:#E5E7E9; --s2t:#E5E7E9; --s3t:#FFFFFF; --s4t:#13161A; --s5t:#13161A;
 color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px}
.wrap{max-width:1320px;margin:0 auto}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:22px 14px;border-bottom:1px solid var(--line)}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.05;margin:0;letter-spacing:-.01em}
.brand p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.tabs{display:flex;gap:4px}
.tab{border:1px solid var(--line);background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpis{display:flex;flex-wrap:wrap;gap:4px 22px;padding-block:10px;color:var(--muted);font-size:13px}
.kpis b{font-family:var(--f-mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:4px}

.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;padding-top:18px}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
aside.filters{display:flex;flex-direction:column;gap:18px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
@media (max-width:860px){aside.filters{position:static;max-height:none}}
.fgroup h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600;display:flex;justify-content:space-between}
.fgroup h3 button{border:0;background:none;color:var(--accent);font-size:11px;letter-spacing:0;text-transform:none;cursor:pointer;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:2px 7px;font-size:12px;cursor:pointer;display:inline-flex;gap:5px;align-items:baseline;line-height:1.5}
.chip .n{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.chip.zero{opacity:.38}
input[type=search]{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:7px 10px;font:inherit}
.reset{align-self:flex-start;border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:13px}

/* lista */
.listhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.listhead h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.eplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.ep{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.ep:hover{border-color:var(--muted)}
.ep .id{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.ep h4{margin:0;font-size:15px;font-weight:600;line-height:1.3}
.ep p{margin:0;color:var(--muted);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.strip{display:flex;gap:2px;height:7px}
.strip span{flex:1;border-radius:1px}
.strip.empty{background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px);border-radius:1px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;padding:1px 6px;border-radius:3px;background:var(--sunk);color:var(--ink)}
.tag.main{background:var(--accent-soft);color:var(--accent)}
.empty-state{padding:40px 0;color:var(--muted)}

/* ficha */
.back{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;margin-bottom:10px}
.ficha-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:18px 32px;padding-bottom:18px;border-bottom:1px solid var(--line)}
@media (max-width:980px){.ficha-head{grid-template-columns:minmax(0,1fr)}}
.ficha-head .eyebrow{color:var(--muted)}
.ficha-head h2{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.08;margin:4px 0 10px;text-wrap:balance}
.ficha-head .res{margin:0;max-width:72ch;font-size:15px}
dl.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;margin:0;font-size:13px;align-content:start}
dl.meta dt{color:var(--muted)}
dl.meta dd{margin:0}
.navep{display:flex;gap:8px;margin-top:10px}
.navep button{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:3px 10px;cursor:pointer;font-size:12px}
.navep button:disabled{opacity:.4;cursor:default}

section.block{padding-block:26px 6px}
section.block>h3{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0 0 4px}
section.block>.sub{color:var(--muted);margin:0 0 14px;max-width:80ch;font-size:13px}

.swim{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 8px}
.swim svg{display:block}
.swim text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.swim .dot{cursor:pointer}
.events{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column}
.events li{display:grid;grid-template-columns:30px 120px minmax(0,1fr);gap:4px 12px;padding:9px 0;border-top:1px solid var(--line)}
@media (max-width:600px){.events li{grid-template-columns:30px minmax(0,1fr)}.events li .ph{grid-column:2}.events li .body{grid-column:2}}
.events li.hl{background:var(--accent-soft)}
.events .num{font-family:var(--f-mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.ph{font-size:11px;font-weight:600;letter-spacing:.03em;display:flex;align-items:flex-start;gap:6px}
.ph i{width:9px;height:9px;border-radius:50%;flex:none;margin-top:4px}
.events .ev{font-weight:600}
.events .act{color:var(--muted);font-size:12.5px}
.events .d{margin:2px 0 0}

.netgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
@media (max-width:1060px){.netgrid{grid-template-columns:minmax(0,1fr)}}
.netbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:4px 6px 8px;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:3px 11px;cursor:pointer;color:var(--muted);font-size:12px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sesnum{font-family:var(--f-mono);font-weight:500;pointer-events:none}
.tip{position:fixed;z-index:20;max-width:300px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12.5px;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.18);pointer-events:none}
.tip b{display:block;font-size:13px}
.tip .r{color:var(--muted)}
.tip .ev{margin-top:5px;color:var(--muted)}
.sesscale{display:flex;gap:3px;align-items:center;margin:2px 0 6px}
.sesscale span{width:26px;height:16px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:10.5px;border:1px solid transparent}
.sesscale span.on{outline:2px solid var(--accent);outline-offset:1px}
.netbox{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;min-width:0}
.netbox svg{width:100%;height:auto;display:block}
.netbox text{font-family:var(--f-body);font-size:11.5px;fill:var(--ink)}
.netbox text.ent{fill:var(--muted);font-size:10.5px}
.node{cursor:pointer}
.node .ring{fill:none;stroke:var(--accent);stroke-width:2.5;opacity:0}
.node.sel .ring{opacity:1}
.edge{fill:none;stroke-linecap:round}
.dim{opacity:.12}
.netlegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);padding:8px 6px 2px}
.netlegend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:50%;display:inline-block}
.ln{width:16px;height:3px;border-radius:2px;display:inline-block}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0;max-height:640px;overflow:auto}
.detail h4{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0 0 4px}
.detail .who{color:var(--muted);font-size:12.5px;margin-bottom:8px}
.detail .desc{margin:0 0 12px}
.detail h5{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:600}
.rel{border-top:1px solid var(--line);padding:8px 0;display:flex;flex-direction:column;gap:4px}
.rel .to{font-weight:600;cursor:pointer}
.rel .to:hover{color:var(--accent)}
.rel p{margin:0;font-size:12.5px;color:var(--muted)}
.vtag{font-size:11px;padding:0 6px;border-radius:3px;border:1px solid var(--line)}

.factors{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0}
.fcard h4{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fcard .big{font-size:16px;font-weight:600;margin-bottom:4px}
.fcard p{margin:6px 0 0;font-size:13px}
.vul{border-top:1px solid var(--line);padding:6px 0;font-size:13px}
.vul b{font-weight:600}

.tables{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tblwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;font-size:12px;width:100%}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--muted);background:var(--sunk);position:sticky;top:0;white-space:nowrap}
td{max-width:420px}
td.k{font-family:var(--f-mono);font-size:11px;white-space:nowrap;color:var(--accent)}

/* modelo */
.model{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;padding-top:18px}
@media (max-width:900px){.model{grid-template-columns:minmax(0,1fr)}}
.model h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 8px}
.model p{max-width:66ch}
.pipeline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 20px}
.pipeline span{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-size:12.5px}
.pipeline em{color:var(--muted);font-style:normal}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.tcard .nm{font-family:var(--f-mono);font-size:12px;font-weight:500}
.tcard .cnt{float:right;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tcard .layer{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tcard p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.erd{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px}
.erd svg text{font-family:var(--f-mono);font-size:11px;fill:var(--ink)}
.notes{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 16px;font-size:13px}
.notes h4{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.notes ul{margin:0;padding-left:18px}
@media (prefers-reduced-motion:no-preference){.ep,.chip{transition:border-color .15s,background .15s}}
img{max-width:100%}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Mea Culpa, como datos</h1>
      <p>121 episodios del programa de TV chileno convertidos desde sus subtítulos en una base relacional de 15 tablas: personajes, vínculos, entidades, fases del relato y factores del delito.</p>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-ep" aria-selected="true">Episodios</button>
      <button class="tab" role="tab" id="tab-model" aria-selected="false">Modelo de datos</button>
    </div>
  </header>
  <div class="kpis" id="kpis"></div>

  <main id="view-ep" class="layout">
    <aside class="filters" id="filters"></aside>
    <div id="main" style="min-width:0"></div>
  </main>
  <main id="view-model" hidden></main>
</div>

<script src="assets/data.js"></script>
<script>
const DATA=window.MC_DATA;
const EPS=DATA.eps;
const PHASES=['antecedentes','escalada','detonante','crimen','proceso_legal','consecuencias'];
const PH_LABEL={antecedentes:'Antecedentes',escalada:'Escalada',detonante:'Detonante',crimen:'Crimen',proceso_legal:'Proceso legal',consecuencias:'Consecuencias'};
const ROLES=['victimario','victima','complice','autoridad','tercero_afectado','sin_rol_criminal'];
const POS=new Set(['amor','proteccion','admiracion','confianza','lastima','complicidad','amistad','respeto','preocupacion','esperanza','solidaridad','apoyo','lealtad','compasion','gratitud','deseo']);
const NEG=new Set(['desconfianza','resentimiento','miedo','odio','culpa']);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lab=s=>String(s||'').replace(/_/g,' ');
const pad=n=>String(n).padStart(2,'0');
const code=e=>`T${pad(e.t)} · C${pad(e.c)}`;
function degree(e,id){return e.R.filter(r=>r.a===id||r.b===id).length+e.RE.filter(r=>r.p===id).length}
function protag(e){if(e._pr!==undefined)return e._pr;const ps=e.P.filter(p=>p.rn==='protagonista');const pool=ps.length?ps:e.P;
  e._pr=pool.slice().sort((a,b)=>degree(e,b.id)-degree(e,a.id))[0]||null;return e._pr}
function title(e){const ps=e.P.filter(p=>p.rn==='protagonista');if(ps.length>1)return ps.slice(0,3).map(p=>p.n).join(' · ');const p=protag(e);return p?p.n:e.id}
function valence(r){let p=0,n=0;r.va.forEach(v=>{if(POS.has(v))p++;else if(NEG.has(v))n++});return p&&n?'ambivalente':p?'afecto':n?'hostil':'neutro'}
function mainDel(e){const m=e.del.find(d=>d[1]);return m?m[0]:(e.del[0]||[''])[0]}

/* ---------- filtros ---------- */
const GROUPS=[
  {k:'t',label:'Temporada',get:e=>['T'+pad(e.t)]},
  {k:'del',label:'Delito',get:e=>e.del.map(d=>d[0])},
  {k:'mec',label:'Mecanismo',get:e=>e.mec?[e.mec.tipo]:[]},
  {k:'pat',label:'Patrón relacional',get:e=>e.mec?[e.mec.pat]:[]},
  {k:'cond',label:'Condiciones estructurales',get:e=>e.cond},
  {k:'hab',label:'Habilitadores',get:e=>e.hab},
  {k:'tem',label:'Temas',get:e=>e.tem,search:true,limit:36},
];
const state={sel:Object.fromEntries(GROUPS.map(g=>[g.k,new Set()])),q:'',temq:'',temAll:false};
EPS.forEach(e=>{e._vals={};GROUPS.forEach(g=>e._vals[g.k]=new Set(g.get(e)));
  e._txt=(e.res+' '+e.P.map(p=>p.n).join(' ')+' '+e.loc+' '+e.locs+' '+e.tem.join(' ')).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()});
const allVals={};GROUPS.forEach(g=>{const c=new Map();EPS.forEach(e=>e._vals[g.k].forEach(v=>c.set(v,(c.get(v)||0)+1)));
  allVals[g.k]=[...c.entries()].sort((a,b)=>g.k==='t'?a[0].localeCompare(b[0]):b[1]-a[1]||a[0].localeCompare(b[0]))});
function matches(e,skip){
  if(state.q){const q=state.q.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();if(!q.split(/\s+/).every(w=>e._txt.includes(w)))return false}
  for(const g of GROUPS){if(g.k===skip)continue;const s=state.sel[g.k];if(s.size&&![...s].some(v=>e._vals[g.k].has(v)))return false}
  return true}
function filtered(){return EPS.filter(e=>matches(e))}

const F=document.getElementById('filters');
function renderFilters(){
  let h=`<div><input type="search" id="q" placeholder="Buscar nombre, lugar o palabra…" value="${esc(state.q)}" aria-label="Buscar"></div>`;
  for(const g of GROUPS){
    const pool=EPS.filter(e=>matches(e,g.k));const cnt=new Map();pool.forEach(e=>e._vals[g.k].forEach(v=>cnt.set(v,(cnt.get(v)||0)+1)));
    let vals=allVals[g.k];
    if(g.search&&state.temq){const q=state.temq.toLowerCase();vals=vals.filter(v=>v[0].includes(q))}
    const total=vals.length; if(g.limit&&!state.temAll&&!state.temq) vals=vals.slice(0,g.limit);
    const sel=state.sel[g.k];
    h+=`<div class="fgroup"><h3><span>${g.label}</span>${sel.size?`<button data-clear="${g.k}">limpiar</button>`:''}</h3>`;
    if(g.search)h+=`<input type="search" id="temq" placeholder="Filtrar ${total} temas…" value="${esc(state.temq)}" style="margin-bottom:6px" aria-label="Filtrar temas">`;
    h+=`<div class="chips">`+vals.map(([v])=>{const n=cnt.get(v)||0;return `<button class="chip ${n||sel.has(v)?'':'zero'}" aria-pressed="${sel.has(v)}" data-g="${g.k}" data-v="${esc(v)}">${esc(g.k==='t'?v:lab(v))}<span class="n">${n}</span></button>`}).join('')+`</div>`;
    if(g.limit&&!state.temq&&allVals[g.k].length>g.limit)h+=`<button class="reset" data-more style="margin-top:6px">${state.temAll?'Mostrar menos':'Mostrar los '+allVals[g.k].length+' temas'}</button>`;
    h+=`</div>`}
  const any=state.q||GROUPS.some(g=>state.sel[g.k].size);
  if(any)h+=`<button class="reset" id="resetall">Quitar todos los filtros</button>`;
  F.innerHTML=h;
}
F.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.g){const s=state.sel[b.dataset.g];s.has(b.dataset.v)?s.delete(b.dataset.v):s.add(b.dataset.v)}
  else if(b.dataset.clear)state.sel[b.dataset.clear].clear();
  else if(b.hasAttribute('data-more'))state.temAll=!state.temAll;
  else if(b.id==='resetall'){GROUPS.forEach(g=>state.sel[g.k].clear());state.q='';state.temq=''}
  else return;
  refresh();if(current)goList()});
F.addEventListener('input',ev=>{if(ev.target.id==='q'){state.q=ev.target.value}else if(ev.target.id==='temq'){state.temq=ev.target.value}else return;
  const id=ev.target.id,pos=ev.target.selectionStart;refresh();const el=document.getElementById(id);if(el){el.focus();el.setSelectionRange(pos,pos)}if(current&&id==='q')goList()});

    <div class="netgrid"><div class="netbox"><div class="netbar">Color de los nodos <span class="seg" role="group" aria-label="Color de los nodos"><button id="cb-rol" aria-pressed="${colorBy==='rol'}">Rol criminológico</button><button id="cb-ses" aria-pressed="${colorBy==='ses'}">Nivel socioeconómico</button></span></div><div id="netsvg">${network(e)}</div><div id="netleg">${netLegend()}</div></div><div class="detail" id="detail"></div></div>

/* hilo narrativo */
function swimlane(e){
  const n=e.F.length,cw=Math.max(46,Math.min(70,760/n)),L=112,top=10,rh=26,W=L+cw*n+16,H=top+rh*6+28;
  const x=i=>L+cw*i+cw/2,y=f=>top+rh*Math.max(0,PHASES.indexOf(f))+rh/2;
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Secuencia de fases">`;
  PHASES.forEach((p,j)=>{s+=`<rect x="${L-6}" y="${top+rh*j+2}" width="${W-L-4}" height="${rh-4}" rx="3" fill="var(--ph-${p})" opacity=".09"/><text x="${L-12}" y="${top+rh*j+rh/2+4}" text-anchor="end">${PH_LABEL[p]}</text>`});
  s+=`<polyline points="${e.F.map((f,i)=>x(i)+','+y(f.f)).join(' ')}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" opacity=".6"/>`;
  e.F.forEach((f,i)=>{s+=`<g class="dot" data-i="${i}" tabindex="0"><title>${f.o}. ${esc(lab(f.ev))}</title><circle cx="${x(i)}" cy="${y(f.f)}" r="7" fill="var(--ph-${f.f})" stroke="var(--panel)" stroke-width="2"/></g><text x="${x(i)}" y="${H-8}" text-anchor="middle" class="mono">${f.o}</text>`});
  return `<div class="swim">${s}</svg></div>`}
function eventList(e){return `<ol class="events" id="events">${e.F.map((f,i)=>`<li id="ev${i}"><span class="num">${f.o}</span><span class="ph" style="color:var(--ph-${f.f})"><i style="background:var(--ph-${f.f})"></i>${PH_LABEL[f.f]||esc(f.f)}</span><div class="body"><span class="ev">${esc(lab(f.ev))}</span>${f.act?` <span class="act">· ${esc(f.act)}</span>`:''}<p class="d">${esc(f.d)}</p></div></li>`).join('')}</ol>`}
function wireSwim(){document.querySelectorAll('.swim .dot').forEach(g=>{const go=()=>{document.querySelectorAll('.events li').forEach(l=>l.classList.remove('hl'));const li=document.getElementById('ev'+g.dataset.i);if(li){li.classList.add('hl');li.scrollIntoView({block:'nearest',behavior:'smooth'})}};g.addEventListener('click',go);g.addEventListener('keydown',k=>{if(k.key==='Enter')go()})})}

/* red */
let NET=null;
function network(e){
  const W=720,H=640,cx=W/2,cy=H/2,r1=160,r2=250;const pr=protag(e);
  const others=e.P.filter(p=>p!==pr);
  // ordenar personas: primero las conectadas al protagonista
  const deg=id=>e.R.filter(r=>(r.a===id&&r.b===pr?.id)||(r.b===id&&r.a===pr?.id)).length;
  others.sort((a,b)=>deg(b.id)-deg(a.id)||a.id.localeCompare(b.id));
  const pos={};if(pr)pos['P:'+pr.id]={x:cx,y:cy,a:0};
  others.forEach((p,i)=>{const a=-Math.PI/2+2*Math.PI*i/Math.max(1,others.length);pos['P:'+p.id]={x:cx+r1*Math.cos(a),y:cy+r1*Math.sin(a),a}});
  // entidades: cerca del ángulo medio de las personas a las que se vinculan
  const ents=e.E.map(en=>{const ps=e.RE.filter(r=>r.e===en.id).map(r=>pos['P:'+r.p]).filter(p=>p&&!(p.x===cx&&p.y===cy));
    let a=ps.length?Math.atan2(ps.reduce((s,p)=>s+Math.sin(p.a),0),ps.reduce((s,p)=>s+Math.cos(p.a),0)):0;return {en,a}}).sort((u,v)=>u.a-v.a);
  ents.forEach((o,i)=>{const a=o.a+ (i*0)/1;o.a2=a});
  // repartir uniformemente manteniendo el orden
  const off=ents.length?ents[0].a:0;ents.forEach((o,i)=>{const a=off+2*Math.PI*i/Math.max(1,ents.length);pos['E:'+o.en.id]={x:cx+r2*Math.cos(a),y:cy+r2*Math.sin(a),a}});
  NET={pos,e};
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Red de relaciones del episodio"><defs>${['afecto','hostil','ambivalente','neutro'].map(v=>`<marker id="m-${v}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="var(--v-${v})"/></marker>`).join('')}</defs>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${r1}" fill="none" stroke="var(--line)" stroke-dasharray="2 4"/><circle cx="${cx}" cy="${cy}" r="${r2}" fill="none" stroke="var(--line)" stroke-dasharray="2 4"/>`;
  // aristas persona-entidad
  e.RE.forEach((r,i)=>{const a=pos['P:'+r.p],b=pos['E:'+r.e];if(!a||!b)return;s+=`<line class="edge pe" data-a="P:${r.p}" data-b="E:${r.e}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>`});
  // aristas persona-persona (curvas suaves)
  e.R.forEach(r=>{const a=pos['P:'+r.a],b=pos['P:'+r.b];if(!a||!b)return;const v=valence(r);
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,k=.12;
    const qx=mx-dy*k,qy=my+dx*k;const shrink=15;
    const ex=b.x-(b.x-qx)/Math.hypot(b.x-qx,b.y-qy)*shrink,ey=b.y-(b.y-qy)/Math.hypot(b.x-qx,b.y-qy)*shrink;
    const sx=a.x-(a.x-qx)/Math.hypot(a.x-qx,a.y-qy)*shrink,sy=a.y-(a.y-qy)/Math.hypot(a.x-qx,a.y-qy)*shrink;
    const ms=r.asi==='from_domina'?`marker-end="url(#m-${v})"`:r.asi==='to_domina'?`marker-start="url(#m-${v})"`:'';
    const w=r.vp.includes('victimario_victima')?3:1.8;
    s+=`<path class="edge pp" data-a="P:${r.a}" data-b="P:${r.b}" d="M${sx},${sy} Q${qx},${qy} ${ex},${ey}" stroke="var(--v-${v})" stroke-width="${w}" ${ms}><title>${esc(r.vp.map(lab).join(', '))} · ${esc(r.va.join(', '))}</title></path>`});
  // nodos entidad
  e.E.forEach(en=>{const p=pos['E:'+en.id];const sz=en.cen==='alta'?11:en.cen==='media'?9:7;const left=Math.cos(p.a)<-0.2,right=Math.cos(p.a)>0.2;
    const tx=p.x+Math.cos(p.a)*(sz+6),ty=p.y+Math.sin(p.a)*(sz+6)+4;
    s+=`<g class="node" data-id="E:${en.id}" tabindex="0"><title>${esc(en.n)} (${esc(lab(en.tp))})</title><rect class="ring" x="${p.x-sz-4}" y="${p.y-sz-4}" width="${2*sz+8}" height="${2*sz+8}" rx="3"/><rect x="${p.x-sz}" y="${p.y-sz}" width="${2*sz}" height="${2*sz}" rx="2" fill="var(--sunk)" stroke="var(--muted)" stroke-width="1.2" transform="rotate(45 ${p.x} ${p.y})"/><text class="ent" x="${tx}" y="${ty}" text-anchor="${left?'end':right?'start':'middle'}">${esc(trunc(en.n,20))}</text></g>`});
  // nodos persona
  e.P.forEach(p=>{const q=pos['P:'+p.id];const isPr=p===pr;const R=isPr?20:p.rn==='protagonista'?15:p.rn==='antagonista'?13:p.rn==='personaje_menor'?8:11;
    const c=colorBy==='ses'?sesFill(p):`var(--r-${p.rc}, var(--r-sin_rol_criminal))`;
    const noSes=colorBy==='ses'&&!p.ses;
    let tx,ty,anc;if(isPr){tx=q.x;ty=q.y+R+15;anc='middle'}else{const ca=Math.cos(q.a),sa=Math.sin(q.a);tx=q.x+ca*(R+7);ty=q.y+sa*(R+7)+4;anc=ca<-0.25?'end':ca>0.25?'start':'middle';if(anc==='middle')ty=q.y+sa*(R+9)+(sa>0?10:-2)}
    s+=`<g class="node" data-id="P:${p.id}" tabindex="0" aria-label="${esc(p.n)}, ${esc(lab(p.rc))}, NSE ${p.ses||'sin dato'}"><circle class="ring" cx="${q.x}" cy="${q.y}" r="${R+5}"/><circle cx="${q.x}" cy="${q.y}" r="${R}" fill="${c}" stroke="${noSes?'var(--muted)':'var(--panel)'}" stroke-width="${noSes?1.2:2}" ${noSes?'stroke-dasharray="2 2"':''}/>${colorBy==='ses'?`<text class="sesnum" x="${q.x}" y="${q.y+(R>=11?4:3.3)}" text-anchor="middle" style="font-size:${R>=13?12:R>=11?10.5:9}px;fill:${p.ses?`var(--s${p.ses}t)`:'var(--muted)'}">${p.ses||'?'}</text>`:''}${p.rn==='protagonista'?`<circle cx="${q.x}" cy="${q.y}" r="${R+2}" fill="none" stroke="${c}" stroke-width="1"/>`:''}<text x="${tx}" y="${ty}" text-anchor="${anc}" style="font-weight:${isPr||p.rn==='protagonista'?600:400}">${esc(trunc(p.n,26))}</text></g>`});
  return s+`</svg>`}
function trunc(s,n){return s.length>n?s.slice(0,n-1)+'…':s}
function netLegend(){return `<div class="netlegend">${colorBy==='ses'?[1,2,3,4,5].map(n=>`<span><i class="sw" style="background:var(--s${n})"></i>${n} ${SES_LABEL[n]}</span>`).join('')+`<span><i class="sw" style="border:1px dashed var(--muted)"></i>sin dato</span>`:ROLES.map(r=>`<span><i class="sw" style="background:var(--r-${r})"></i>${lab(r)}</span>`).join('')}<span><i class="sw" style="background:var(--sunk);border:1px solid var(--muted);border-radius:2px;transform:rotate(45deg) scale(.8)"></i>entidad</span></div>
  <div class="netlegend">${[['afecto','afecto (amor, protección…)'],['hostil','hostil (miedo, odio…)'],['ambivalente','ambivalente (ambos)'],['neutro','neutro']].map(([v,l])=>`<span><i class="ln" style="background:var(--v-${v})"></i>${l}</span>`).join('')}<span><i class="ln" style="background:var(--muted);height:4px"></i>línea gruesa: victimario–víctima</span></div>`}
let TIP=null;
function tipFor(id){const e=current;const [k,x]=id.split(':');
  if(k==='P'){const p=e.P.find(q=>q.id===x);if(!p)return '';
    return `<b>${esc(p.n)}</b><span class="r">${esc([lab(p.rn),lab(p.rc),p.occ].filter(Boolean).join(' · '))}</span><div style="margin-top:4px"><span class="mono">NSE ${p.ses?p.ses+' · '+SES_LABEL[p.ses]:'sin dato'}</span></div>${p.se?`<div class="ev">${esc(p.se)}</div>`:''}`}
  const o=e.E.find(q=>q.id===x);return o?`<b>${esc(o.n)}</b><span class="r">${esc([lab(o.tp),lab(o.st)].filter(Boolean).join(' · '))}</span>`:''}
function showTip(g,ev){if(!TIP){TIP=document.createElement('div');TIP.className='tip';document.body.appendChild(TIP)}
  TIP.innerHTML=tipFor(g.dataset.id);TIP.hidden=false;
  let x,y;if(ev&&ev.clientX!=null){x=ev.clientX+14;y=ev.clientY+14}else{const r=g.getBoundingClientRect();x=r.right+8;y=r.top}
  const w=TIP.offsetWidth,h=TIP.offsetHeight;if(x+w>innerWidth-8)x=Math.max(8,x-w-28);if(y+h>innerHeight-8)y=Math.max(8,innerHeight-h-8);TIP.style.left=x+'px';TIP.style.top=y+'px'}
function hideTip(){if(TIP)TIP.hidden=true}
function wireNet(){
  document.querySelectorAll('.netbox .node').forEach(g=>{const go=()=>{selNode=g.dataset.id;focusOn=true;renderDetail()};g.addEventListener('click',go);g.addEventListener('keydown',k=>{if(k.key==='Enter')go()});
    g.addEventListener('pointermove',ev=>{if(ev.pointerType==='mouse')showTip(g,ev)});g.addEventListener('pointerleave',hideTip);g.addEventListener('focus',()=>showTip(g));g.addEventListener('blur',hideTip)});
  ['rol','ses'].forEach(m=>{const b=document.getElementById('cb-'+m);if(b)b.onclick=()=>{colorBy=m;try{localStorage.setItem('mc-colorby',m)}catch(_){}
    document.getElementById('cb-rol').setAttribute('aria-pressed',m==='rol');document.getElementById('cb-ses').setAttribute('aria-pressed',m==='ses');
    document.getElementById('netsvg').innerHTML=network(current);document.getElementById('netleg').innerHTML=netLegend();hideTip();wireNet();highlight()}})}
function highlight(){if(!focusOn)return;const id=selNode;const nb=new Set([id]);
  document.querySelectorAll('.netbox .edge').forEach(l=>{const on=l.dataset.a===id||l.dataset.b===id;l.classList.toggle('dim',!on);if(on){nb.add(l.dataset.a);nb.add(l.dataset.b)}});
  document.querySelectorAll('.netbox .node').forEach(n=>{n.classList.toggle('sel',n.dataset.id===id);n.classList.toggle('dim',!nb.has(n.dataset.id))})}
function renderDetail(){const e=current,D=document.getElementById('detail');if(!D)return;highlight();
  const [kind,id]=selNode.split(':');const pn=x=>e.P.find(p=>p.id===x),en=x=>e.E.find(p=>p.id===x);
  let h='';
  if(kind==='P'){const p=pn(id);if(!p){D.innerHTML='';return}
    h=`<h4>${esc(p.n)}</h4><div class="who">${[lab(p.rn),lab(p.rc),p.sx,lab(p.edad),p.occ].filter(Boolean).map(esc).join(' · ')}</div><p class="desc">${esc(p.d)}</p>
      <h5>Nivel socioeconómico</h5><div class="sesscale">${[1,2,3,4,5].map(n=>`<span class="${p.ses==n?'on':''}" style="background:var(--s${n});color:var(--s${n}t)">${n}</span>`).join('')}<span style="width:auto;color:var(--muted);font-family:var(--f-body);font-size:12px;padding-left:6px">${p.ses?SES_LABEL[p.ses]:'sin dato'}</span></div>${p.se?`<p style="margin:0 0 4px;font-size:12.5px;color:var(--muted)">${esc(p.se)}</p>`:''}`;
    const rs=e.R.filter(r=>r.a===id||r.b===id);
    h+=`<h5>Relaciones con personas (${rs.length})</h5>`+rs.map(r=>{const o=pn(r.a===id?r.b:r.a);const v=valence(r);
      const dom=r.asi==='par'?'relación entre pares':r.asi==='variable'?'poder variable':r.asi==='incierta'?'poder incierto':((r.asi==='from_domina')===(r.a===id)?'domina a':'es dominado por');
      return `<div class="rel"><span><span class="to" data-go="P:${o?.id}">${esc(o?.n||'?')}</span> <span style="color:var(--muted);font-size:12px">· ${dom}${o?.ses?` · NSE ${o.ses}`:''}</span></span>
      <span class="tags">${r.vp.map(x=>`<span class="tag">${esc(lab(x))}</span>`).join('')}${r.va.map(x=>`<span class="vtag" style="color:var(--v-${POS.has(x)?'afecto':NEG.has(x)?'hostil':'neutro'})">${esc(x)}</span>`).join('')}</span><p>${esc(r.d)}</p></div>`}).join('');
    const re=e.RE.filter(r=>r.p===id);
    if(re.length)h+=`<h5>Vínculos con entidades (${re.length})</h5>`+re.map(r=>{const o=en(r.e);return `<div class="rel"><span><span style="color:var(--muted)">${esc(lab(r.v))}</span> <span class="to" data-go="E:${r.e}">${esc(o?.n||'?')}</span></span><p>${esc(r.d)}</p></div>`}).join('');
  }else{const o=en(id);if(!o){D.innerHTML='';return}
    h=`<h4>${esc(o.n)}</h4><div class="who">${[lab(o.tp),lab(o.st),lab(o.fn),o.cen?'centralidad '+o.cen:''].filter(Boolean).map(esc).join(' · ')}</div><p class="desc">${esc(o.d)}</p>`;
    const re=e.RE.filter(r=>r.e===id);
    h+=`<h5>Personas vinculadas (${re.length})</h5>`+re.map(r=>{const p=pn(r.p);return `<div class="rel"><span><span class="to" data-go="P:${r.p}">${esc(p?.n||'?')}</span> <span style="color:var(--muted)">${esc(lab(r.v))}</span></span><p>${esc(r.d)}</p></div>`}).join('')}
  D.innerHTML=h;D.scrollTop=0;
  D.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>{selNode=a.dataset.go;focusOn=true;renderDetail()})}

/* factores */
function factors(e){const m=e.mec;
  const byV={};e.vul.forEach(v=>{(byV[v.v]=byV[v.v]||[]).push(v)});
  return `<div class="factors">
   <div class="fcard"><h4>Mecanismo causal</h4>${m?`<div class="big">${esc(lab(m.tipo))}</div><div class="tags"><span class="tag">${esc(lab(m.pat))}</span></div><p><b>Detonante.</b> ${esc(m.det)}</p><p style="color:var(--muted)">${esc(m.d)}</p>`:'<p style="color:var(--muted)">Sin registro en 11_mecanismos.</p>'}</div>
   <div class="fcard"><h4>Condiciones estructurales</h4><div class="tags">${e.cond.map(c=>`<span class="tag">${esc(lab(c))}</span>`).join('')||'<span style="color:var(--muted)">Sin registro.</span>'}</div>
     <h4 style="margin-top:16px">Habilitadores</h4><div class="tags">${e.hab.map(c=>`<span class="tag">${esc(lab(c))}</span>`).join('')||'<span style="color:var(--muted)">Sin registro.</span>'}</div></div>
   <div class="fcard"><h4>Vulnerabilidades de las víctimas</h4>${Object.keys(byV).length?Object.entries(byV).map(([v,arr])=>`<div class="vul"><b>${esc(v)}</b><div class="tags" style="margin:3px 0">${arr.filter(a=>a.tp).map(a=>`<span class="tag">${esc(lab(a.tp))}</span>`).join('')}</div><span style="color:var(--muted);font-size:12.5px">${esc(arr[0].d)}</span></div>`).join(''):'<p style="color:var(--muted)">Sin registro.</p>'}</div>
  </div>`}

/* tablas crudas */
function epTables(e){const id=e.id;
  return {
   '04_personajes':{rows:e.P,cols:[['id_personaje','id'],['nombre','n'],['rol_narrativo','rn'],['rol_criminologico','rc'],['sexo','sx'],['grupo_etario','edad'],['ses_nivel','ses'],['ses_evidencia','se']]},
   '05_relaciones':{rows:e.R,cols:[['id_relacion','id'],['from_personaje','a'],['to_personaje','b'],['asimetria_poder','asi'],['descripcion','d']]},
   '06_vinculos_practicos':{rows:e.R.flatMap(r=>r.vp.map(v=>({id:r.id,v}))),cols:[['id_relacion','id'],['vinculo_practico','v']]},
   '07_vinculos_afectivos':{rows:e.R.flatMap(r=>r.va.map(v=>({id:r.id,v}))),cols:[['id_relacion','id'],['vinculo_afectivo','v']]},
   '08_entidades':{rows:e.E,cols:[['id_entidad','id'],['nombre','n'],['tipo','tp'],['subtipo','st'],['funcion_narrativa','fn'],['centralidad','cen']]},
   '09_relaciones_pers_ent':{rows:e.RE,cols:[['id_personaje','p'],['id_entidad','e'],['tipo_vinculo','v'],['asimetria','asi'],['descripcion','d']]},
   '10_fases_narrativas':{rows:e.F,cols:[['orden','o'],['fase','f'],['tipo_evento','ev'],['actores','act']]},
   '12_condiciones':{rows:e.cond.map(c=>({c})),cols:[['condicion_estructural','c']]},
   '13_habilitadores':{rows:e.hab.map(c=>({c})),cols:[['habilitador','c']]},
   '14_vulnerabilidades':{rows:e.vul,cols:[['victima','v'],['tipo_vulnerabilidad','tp'],['descripcion','d']]},
  }}
function renderTables(sel){const T=epTables(current);
  document.getElementById('tblchips').innerHTML=Object.entries(T).map(([k,t])=>`<button class="chip" aria-pressed="${k===sel}" data-t="${k}"><span class="mono">${k}</span><span class="n">${t.rows.length}</span></button>`).join('');
  document.querySelectorAll('#tblchips .chip').forEach(b=>b.onclick=()=>renderTables(b.dataset.t));
  const t=T[sel];const keyCols=new Set(['id','a','b','p','e','o']);
  document.getElementById('tbl').innerHTML=`<div class="tblwrap"><table><thead><tr><th>id_episodio</th>${t.cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr><td class="k">${current.id}</td>${t.cols.map(c=>`<td class="${keyCols.has(c[1])?'k':''}">${esc(Array.isArray(r[c[1]])?r[c[1]].join(', '):r[c[1]])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}

function erd(){
  // diagrama simple: episodio al centro, tablas hijas alrededor
  const B=(x,y,w,t,keys,hl)=>`<g><rect x="${x}" y="${y}" width="${w}" height="${20+keys.length*15}" rx="4" fill="var(--${hl?'accent-soft':'sunk'})" stroke="var(--line)"/><text x="${x+8}" y="${y+14}" style="font-weight:600">${t}</text>${keys.map((k,i)=>`<text x="${x+8}" y="${y+31+i*15}" style="fill:var(--muted)">${k}</text>`).join('')}</g>`;
  const L=(x1,y1,x2,y2)=>`<path d="M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}" fill="none" stroke="var(--muted)" stroke-width="1"/>`;
  let s=`<svg width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="Diagrama de relaciones entre tablas">`;
  s+=L(170,200,250,60)+L(170,200,250,150)+L(170,200,250,250)+L(170,200,250,340)+L(410,60,480,40)+L(410,60,480,120)+L(410,150,480,200)+L(410,150,480,120)+L(410,60,480,280)+L(410,150,480,280)+L(170,200,250,250);
  s+=B(16,170,154,'01_episodios',['PK id_episodio','02 delitos · 03 temas'],true);
  s+=B(250,30,160,'04_personajes',['PK id_personaje','FK id_episodio']);
  s+=B(250,120,160,'08_entidades',['PK id_entidad','FK id_episodio']);
  s+=B(250,225,160,'10_fases_narrativas',['FK id_episodio','orden']);
  s+=B(250,310,160,'11 · 12 · 13 · 14',['FK id_episodio','causas y víctimas']);
  s+=B(480,10,200,'05_relaciones',['PK id_relacion','FK from_personaje','FK to_personaje']);
  s+=B(480,95,200,'06 / 07 vínculos',['FK id_relacion','práctico · afectivo']);
  s+=B(480,180,200,'09_relaciones_pers_ent',['FK id_personaje','FK id_entidad']);
  s+=B(480,265,200,'00_master_episodios',['vista ancha: 1 fila','por episodio, 39 col.']);
  return s+`</svg>`}
function renderModel(){
  const C=DATA.counts;
  document.getElementById('view-model').innerHTML=`<div class="model">
